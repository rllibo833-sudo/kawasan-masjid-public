name: Validate GitHub Pages docs
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate published docs files
        run: |
          test -s docs/index.html
          test -s docs/sitemap.xml
          test -s docs/robots.txt
          test -s docs/googleb706ba2b50bad689.html
          grep -q '<urlset' docs/sitemap.xml
          grep -q 'Sitemap: https://rllibo833-sudo.github.io/kawasan-masjid-public/sitemap.xml' docs/robots.txt
          test -d docs/public/images
          echo "GitHub Pages docs source checks passed."
