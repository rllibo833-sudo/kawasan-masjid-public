name: Build and validate GitHub Pages docs
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Restore homepage source HTML
        run: cp site-index.template.html docs/index.html
      - name: Make application source available to Vite from the docs root
        run: cp -R src docs/src
      - name: Build every HTML page, React, and CSS
        run: npm run build
      - name: Copy compiled site into the configured /docs publish directory
        run: |
          test -s dist/index.html
          cp dist/*.html docs/
          rm -rf docs/assets docs/src
          mkdir -p docs/assets docs/images
          cp -R dist/assets/. docs/assets/
          cp -R docs/public/images/. docs/images/
      - name: Validate published output and SEO files
        run: |
          test -s docs/index.html
          test -s docs/sitemap.xml
          test -s docs/robots.txt
          test -s docs/googleb706ba2b50bad689.html
          grep -q 'name="google-site-verification"' docs/index.html
          grep -q '<urlset' docs/sitemap.xml
          grep -q 'Sitemap: https://rllibo833-sudo.github.io/kawasan-masjid-public/sitemap.xml' docs/robots.txt
          grep -Eq 'assets/.*\.css' docs/index.html
          grep -Eq 'assets/.*\.js' docs/index.html
          test -n "$(find docs/assets -maxdepth 1 -type f -name '*.css' -print -quit)"
          test -n "$(find docs/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          test -s docs/about.html
          grep -Eq 'assets/.*\.js' docs/about.html
          test -d docs/images
      - name: Commit generated Pages assets to docs
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.html docs/assets docs/images
          if git diff --cached --quiet; then
            echo "Published output is already up to date."
          else
            git commit -m "build(pages): publish compiled React and CSS assets"
            git push
          fi
