<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Panduan memeriksa ayat Al-Qur'an yang viral</title><desc id="desc">Ilustrasi halaman kitab, kartu rujukan surah dan ayat, serta langkah memeriksa teks, terjemahan, dan konteks.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102b43"/><stop offset="1" stop-color="#123c2c"/></linearGradient><linearGradient id="book" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#eaf2ff"/></linearGradient></defs><rect width="1200" height="560" rx="32" fill="url(#bg)"/><circle cx="250" cy="180" r="180" fill="#34a853" opacity=".15"/><circle cx="1000" cy="350" r="220" fill="#4285f4" opacity=".13"/><g transform="translate(100 90)"><path d="M15 40 Q150 0 300 40 V360 Q150 325 15 360Z" fill="#0a1c2d" opacity=".5"/><path d="M30 25 Q160 -5 295 28 V342 Q160 310 30 342Z" fill="url(#book)"/><path d="M162 20 V320" stroke="#c7d8ec" stroke-width="4"/><g fill="#1769d2" font-family="serif" font-size="27" text-anchor="middle"><text x="96" y="105">بِسْمِ اللَّهِ</text><text x="96" y="145">الرَّحْمَٰنِ</text><text x="96" y="185">الرَّحِيمِ</text></g><path d="M55 230 H135 M55 250 H130 M55 270 H138 M190 90 H270 M190 115 H265 M190 140 H275 M190 165 H260 M190 190 H272 M190 215 H266 M190 240 H274" stroke="#a6bad0" stroke-width="5" stroke-linecap="round"/></g><g transform="translate(525 88)"><rect width="570" height="385" rx="25" fill="#fff"/><text x="36" y="54" fill="#1769d2" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">CEK KUTIPAN AYAT</text><text x="36" y="112" fill="#102b43" font-family="Arial,sans-serif" font-size="29" font-weight="700">Surah dan nomor ayat</text><rect x="36" y="132" width="498" height="48" rx="10" fill="#e8f0fe"/><text x="56" y="163" fill="#174b3a" font-family="Arial,sans-serif" font-size="18">Cocokkan dengan sumber resmi</text><text x="36" y="225" fill="#102b43" font-family="Arial,sans-serif" font-size="24">Teks Arab · Terjemahan · Konteks</text><path d="M36 247 H532" stroke="#dce4ed" stroke-width="2"/><g font-family="Arial,sans-serif" font-size="18" fill="#526174"><circle cx="48" cy="285" r="9" fill="#34a853"/><text x="70" y="292">Baca ayat sebelum dan sesudahnya</text><circle cx="48" cy="325" r="9" fill="#4285f4"/><text x="70" y="332">Periksa tafsir dari sumber tepercaya</text><circle cx="48" cy="365" r="9" fill="#ea4335"/><text x="70" y="372">Ragu? Jangan buru-buru membagikan</text></g></g><text x="62" y="520" fill="#d2e3fc" font-family="Arial,sans-serif" font-size="18" letter-spacing="4">SUMBER JELAS · KONTEKS UTUH · ADAB</text></svg>